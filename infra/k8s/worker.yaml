apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiom-worker
  labels:
    app: axiom-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: axiom-worker
  template:
    metadata:
      labels:
        app: axiom-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: axiom-worker
        image: axiom-engine-worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: axiom-secrets
              key: database-url
        - name: NATS_URL
          valueFrom:
            secretKeyRef:
              name: axiom-secrets
              key: nats-url
        - name: SIDECAR_PATH
          value: "/app/sidecar/dist/app.js"
        - name: RUST_LOG
          value: "info,axiom_worker=debug"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9000
          initialDelaySeconds: 2
          periodSeconds: 10
        # NOTE: No strict liveness probe here because workers can be legitimately blocked executing long steps.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: axiom-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: axiom-worker
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
