apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiom-api
  labels:
    app: axiom-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: axiom-api
  template:
    metadata:
      labels:
        app: axiom-api
    spec:
      containers:
      - name: axiom-api
        image: axiom-engine-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: axiom-secrets
              key: database-url
        - name: RUST_LOG
          value: "info,axiom_api=debug"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: axiom-api
spec:
  selector:
    app: axiom-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
